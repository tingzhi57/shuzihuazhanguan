server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:martyrs_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

jwt:
  secret: martyrs-digital-exhibition-hall-secret-key-2024
  expiration: 86400000
