server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${TIDB_URL:jdbc:mysql://localhost:4000/martyrs_db?sslMode=REQUIRED&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4}
    username: ${TIDB_USER:root}
    password: ${TIDB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: ${JWT_SECRET:martyrs-digital-exhibition-hall-secret-key-2024}
  expiration: 86400000
